name: Build & Release Gradient Zed

on:
  push:
    branches:
      - gradient-zed
    paths:
      - 'crates/zed/Cargo.toml'
    tags:
      - 'gradient-v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release with DMG artifact'
        type: boolean
        default: true

concurrency:
  group: gradient-zed-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  # Fast release profile for 3-vCPU GitHub runners (opt-level=1 + 64 codegen-units + no LTO/DWARF)
  CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '64'
  CARGO_PROFILE_RELEASE_DEBUG: '0'

permissions:
  contents: write
  actions: write

jobs:
  build_macos_arm64:
    name: Build macOS (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout Gradient Zed
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Restore Source Timestamps (Keep Cargo Workspace Cache Fresh)
        run: |
          python3 - <<'PY'
          import os, subprocess

          # Fixed baseline timestamp matching the warm V5 cache epoch so untouched upstream
          # files keep an identical mtime across every future commit (never sliding with git depth).
          BASE_TS = 1794226111

          raw = subprocess.check_output(
              ["git", "-c", "core.quotepath=false", "log", "--format=%x1e%ct%x00", "--name-only", "-z"]
          )
          latest = {}
          for record in raw.split(b"\x1e"):
              if not record:
                  continue
              parts = [p for p in record.split(b"\x00") if p]
              ts = int(parts[0].strip())
              for raw_path in parts[1:]:
                  path = raw_path.lstrip(b"\n").decode("utf-8", "surrogateescape")
                  if path:
                      latest.setdefault(path, max(ts, BASE_TS))

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\x00")
          updated = 0
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = raw_path.decode("utf-8", "surrogateescape")
              if os.path.exists(path) and not os.path.islink(path):
                  ts = latest.get(path, BASE_TS)
                  os.utime(path, (ts, ts))
                  updated += 1
          print(f"Restored git mtimes on {updated} tracked files (base_ts={BASE_TS}, touched={len(latest)})")
          PY

      - name: Select Xcode with macOS SDK >= 26
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app || true
          SDK_VER=$(xcrun --sdk macosx --show-sdk-version || echo "0")
          if (( ${SDK_VER%%.*} < 26 )); then
            for app in /Applications/Xcode_26*.app /Applications/Xcode*.app; do
              if [[ -d "$app" ]]; then
                CANDIDATE_VER=$(DEVELOPER_DIR="$app/Contents/Developer" xcrun --sdk macosx --show-sdk-version 2>/dev/null || echo "0")
                if (( ${CANDIDATE_VER%%.*} >= 26 )); then
                  echo "Selecting $app (SDK $CANDIDATE_VER)"
                  sudo xcode-select -s "$app/Contents/Developer"
                  break
                fi
              fi
            done
          fi
          xcode-select -p
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-path

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          targets: aarch64-apple-darwin

      - name: Restore Rolling Cargo Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # Deterministic key (immune to GitHub macos-26 preinstalled 1.99.1 vs 1.100.0 drift)
          # with rolling run_id+attempt suffix and Cargo.lock-agnostic fallback so patch bumps
          # (e.g. 1.29.3 -> 1.29.4) still reuse the warm workspace cache. Triggering via
          # workflow_dispatch on default branch `gradient-zed` shares the cache across all tags.
          key: v0-rust-macos-arm64-gradient-zed-fast-build_macos_arm64-Darwin-arm64-v3-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v0-rust-macos-arm64-gradient-zed-fast-build_macos_arm64-Darwin-arm64-v3-${{ hashFiles('Cargo.lock') }}-
            v0-rust-macos-arm64-gradient-zed-fast-build_macos_arm64-Darwin-arm64-v3-

      - name: Install Prebuilt cargo-about & cmake
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.8.2

      - name: Ensure cmake
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Compute Semver Release Tag
        id: version
        run: |
          ZED_VER=$(grep -m1 '^version = ' crates/zed/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/gradient-v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="gradient-v${ZED_VER}"
          fi
          echo "zed_version=${ZED_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using release tag: ${TAG}"

      - name: Cache Generated Licenses
        uses: actions/cache@v4
        with:
          path: assets/licenses.md
          key: licenses-v1-${{ hashFiles('Cargo.lock', 'assets/themes/LICENSES', 'assets/icons/LICENSES') }}

      - name: Bundle Gradient Zed (macOS Apple Silicon)
        env:
          CARGO_INCREMENTAL: 0
          SKIP_REMOTE_SERVER: 1
          FAST_BUNDLE: 1
          SKIP_LICENSES_IF_EXISTS: 1
        run: |
          ./script/bundle-mac aarch64-apple-darwin

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GradientZed-aarch64.dmg
          path: target/aarch64-apple-darwin/release/GradientZed-aarch64.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/gradient-v') || (github.event_name == 'push' && github.ref == 'refs/heads/gradient-zed') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Gradient Zed ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            target/aarch64-apple-darwin/release/GradientZed-aarch64.dmg
          body: |
            ## Gradient Zed (macOS Apple Silicon — based on Zed v${{ steps.version.outputs.zed_version }})

            True 4-corner GPU-accelerated radial aurora mesh, 30 curated Gradient Studio presets, 24 FPS synced Breathe animation, Seamless & Per-Panel modes, and 12 built-in Gradient themes.

            ### Install on macOS
            1. Download `GradientZed-aarch64.dmg`, open it, and drag **Gradient Zed.app** into `/Applications` (runs cleanly side-by-side with vanilla Zed).
            2. Because this community build is ad-hoc signed, on first launch run:
               ```bash
               xattr -cr "/Applications/Gradient Zed.app"
               ```
               (or right-click → Open in Finder).
            3. Click **`Studio ▴`** in the bottom-right status bar or press **`Option + Shift + P`** to open Gradient Studio!

      - name: Trim Target Artifacts & Prune Old Caches
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf \
            target/aarch64-apple-darwin/release/*.dmg \
            target/aarch64-apple-darwin/release/*.app \
            target/aarch64-apple-darwin/release/zed \
            target/aarch64-apple-darwin/release/cli \
            target/aarch64-apple-darwin/release/remote_server \
            target/aarch64-apple-darwin/release/incremental \
            target/release/incremental || true
          # Keep only the 1 newest rust cache before Post-save writes this run's updated cache
          OLD_IDS=$(gh api "repos/${{ github.repository }}/actions/caches?per_page=50" \
            --jq '[.actions_caches[] | select(.key | startswith("v0-rust-macos-arm64-gradient-zed-fast-"))] | sort_by(.created_at) | reverse | .[1:] | .[].id' 2>/dev/null || true)
          for id in $OLD_IDS; do
            echo "Pruning stale cargo cache $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" || true
          done

      - name: Save Rolling Cargo Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: v0-rust-macos-arm64-gradient-zed-fast-build_macos_arm64-Darwin-arm64-v3-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
